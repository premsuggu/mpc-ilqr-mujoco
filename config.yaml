robot:
  name: dm_humanoid
  model_path: "robots/dm_humanoid/humanoid.xml"
  urdf_path: "robots/dm_humanoid/humanoid.xml"
  ee_feet:
    right_feet_ee: "foot_right"
    left_feet_ee: "foot_left"

reference_trajectory:
  q_ref: "data/dm_humanoid/q_standing.csv"
  v_ref: "data/dm_humanoid/v_standing.csv"
  contact_schedule: "data/dm_humanoid/contact_standing.csv"

mpc:
  horizon: 23              # MJPC: 0.35s / 0.015s = 23 steps
  dt: 0.02                # MJPC timestep (15ms)
  physics_dt: 0.02        # MuJoCo substep (keep fine for stability)
  gravity: [0.0, 0.0, -1.0]  # Standard gravity (MJPC uses full gravity)
  sim_steps: 50            # Total simulation steps
  contact_impratio: 100.0  # Contact stiffness

  cost_weights:
    # State deviation weights (Q matrix) - MJPC-inspired
    Q_position_x: 5.0        # Reduced from 200.0
    Q_position_y: 5.0        # Reduced from 50.0
    Q_position_z: 5.0        # MJPC "Height" = 5.0 (was 200.0 - 40x reduction!)
    Q_quat_w: 5.0            # MJPC "Upright" = 5.0 (was 50.0)
    Q_quat_xyz: [5.0, 5.0, 5.0]  # Match upright weight (was [50, 50, 50])
    Q_joint_pos: 0.025       # MJPC "Posture" = 0.025 (was 50.0 - 2000x reduction!)
    Q_vel_x: 10.0            # Keep moderate damping
    Q_vel_y: 10.0            # Keep moderate damping
    Q_vel_z: 10.0            # Reduced from 150.0
    Q_ang_vel: 10.0          # Reduced from 75.0
    Q_joint_vel: 10.0        # Reduced from 75.0
    
    # Control effort weight (R matrix)
    R_control: 0.1           # MJPC "Control" = 0.1 (was 0.01 - 10x increase)
    
    # Terminal cost multiplier (Qf = Q * Qf_multiplier)
    Qf_multiplier: 2.0       # Keep same
    Qf_position_x: 2.0       # Reduced from 5.0
    Qf_position_y: 2.0       # Keep same
    Qf_position_z: 2.0       # Reduced from 5.0
    Qf_vel_z: 2.0            # Reduced from 4.0
    
    # Task-specific weights - MJPC-inspired
    W_com_pos: 5.0           # MJPC "Balance" = 5.0 (was 100.0 - 20x reduction!)
    W_com_vel: 0.0           # Keep disabled
    W_foot: 1.0              # MJPC "Pelvis/Feet" = 1.0 (was 400.0 - 400x reduction!)
    W_foot_vel: 1.0          # Match foot position (was 400.0 - 400x reduction!)
    W_upright: 5.0           # MJPC "Upright" = 5.0 (was 20.0 - 4x reduction)
    w_balance: 5.0           # MJPC "Balance" = 5.0 (was 30.0 - 6x reduction)

  # Norm types for each cost term
  # Available types: quadratic (0), l22 (1), l2 (2), cosh (3), smooth_abs_2_loss (7)
  # Parameters: p (regularization), q (power for L22 norm)
  norm_types:
    com_position:
      type: 0      # quadratic: r^T*r
      p: 1.0
      q: 1.0
    com_velocity:
      type: 0
      p: 1.0
      q: 1.0
    ee_position_foot_left:
      type: 0
      p: 1.0
      q: 1.0
    ee_position_foot_right:
      type: 0
      p: 1.0
      q: 1.0
    ee_velocity_foot_left:
      type: 0
      p: 1.0
      q: 1.0
    ee_velocity_foot_right:
      type: 0
      p: 1.0
      q: 1.0
    upright:
      type: 0
      p: 1.0
      q: 1.0
    balance:
      type: 0
      p: 1.0
      q: 1.0

  constraints:
    joint_limit_weight: 1500.0    # Keep same (safety)
    torque_limit_weight: 1500.0   # Keep same (safety)

  # iLQR solver settings
  ilqr_settings:
    # Main solver parameters
    initial_regularization: 1.0e-6    # Initial regularization lambda
    max_iterations: 10                # Maximum iLQR iterations per solve
    tolerance: 1.0e-4                 # Relative cost change tolerance
    
    # Regularization adaptation (trust region)
    reg_min: 1.0e-6                   # Minimum regularization
    reg_max: 100.0                    # Maximum regularization
    reg_increase_factor: 10.0         # Multiply by this when model is poor
    reg_decrease_factor: 10.0         # Divide by this when model is good
    trust_region_good: 0.75           # Threshold for good model (ratio > this)
    trust_region_poor: 0.25           # Threshold for poor model (ratio < this)
    
    # Line search parameters
    line_search_alphas: [1.0, 0.8, 0.6, 0.4, 0.2, 0.1, 0.05, 0.01]  # Step sizes to try
    line_search_tolerance: 1.0e-6     # Minimum cost decrease required
    
    # Numerical stability
    quu_regularization: 1.0e-4        # Extra regularization for Quu matrix
    convergence_threshold: 1.0e-8     # Absolute cost change threshold

paths:
  logs_dir: "logs"
  results_dir: "results"

logging:
  verbose: true
  save_trajectories: true
  results_path: "results"

visualization:
  enable_rerun: False
