robot:
  name: dm_humanoid
  model_path: "robots/dm_humanoid/humanoid.xml"
  urdf_path: "robots/dm_humanoid/humanoid.xml"
  ee_feet:
    right_feet_ee: "foot_right"
    left_feet_ee: "foot_left"

reference_trajectory:
  q_ref: "data/dm_humanoid/q_standing.csv"
  v_ref: "data/dm_humanoid/v_standing.csv"
  contact_schedule: "data/dm_humanoid/contact_standing.csv"

mpc:
  horizon: 23              # MJPC: 0.35s / 0.015s = 23 steps
  dt: 0.02                # MJPC timestep (15ms)
  physics_dt: 0.02        # MuJoCo substep (keep fine for stability)
  gravity: [0.0, 0.0, -1.0]  # Standard gravity (MJPC uses full gravity)
  sim_steps: 50            # Total simulation steps
  contact_impratio: 100.0  # Contact stiffness

  cost_weights:
    # State deviation weights (Q matrix) - Aligned with DeepMind MJPC
    Q_position_x: 5.0        # DeepMind "Height" (x) = 5.0
    Q_position_y: 5.0        # DeepMind "Height" (y) = 5.0
    Q_position_z: 5.0        # DeepMind "Height" (z) = 5.0 - TORSO HEIGHT TRACKING
    Q_quat_w: 5.0            # DeepMind "Upright" = 5.0
    Q_quat_xyz: [5.0, 5.0, 5.0]  # Orientation tracking
    Q_joint_pos: 0.025       # DeepMind "Posture" = 0.025
    Q_vel_x: 0.0             # Not in MJPC (set to 0)
    Q_vel_y: 0.0             # Not in MJPC (set to 0)
    Q_vel_z: 0.0             # Not in MJPC (set to 0)
    Q_ang_vel: 0.0           # Not in MJPC (set to 0)
    Q_joint_vel: 0.0         # Not in MJPC (set to 0)
    
    # Control effort weight (R matrix)
    R_control: 0.1           # DeepMind "Control" = 0.1
    
    # Terminal cost multiplier (Qf = Q * Qf_multiplier)
    Qf_multiplier: 2.0       # Keep same
    Qf_position_x: 2.0
    Qf_position_y: 2.0
    Qf_position_z: 2.0
    Qf_vel_z: 2.0
    
    # Task-specific weights - DeepMind MJPC
    # These weights can be scalars (uniform) or 3D vectors [x, y, z] for component-wise tuning
    # Vector format allows prioritizing specific directions (e.g., vertical height over horizontal drift)
    
    W_com_pos: [5.0, 5.0, 5.0]       # CoM position tracking [x, y, z] - DeepMind "Balance" = 5.0
                                      # Example: [1.0, 1.0, 10.0] to prioritize height
    
    W_com_vel: [0.625, 0.625, 0.625] # CoM velocity tracking [x, y, z] - DeepMind "Velocity" = 0.625
                                      # Controls forward/lateral velocity tracking
    
    W_foot: [1.0, 1.0, 1.0]          # End-effector position [x, y, z] - DeepMind "Pelvis/Feet" = 1.0
                                      # Applied during swing phase for foot trajectory tracking
                                      # Example: [1.0, 1.0, 5.0] to prioritize foot clearance height
    
    W_foot_vel: [1.0, 1.0, 1.0]      # End-effector velocity [x, y, z] - DeepMind = 1.0
                                      # Applied during stance phase to keep foot planted
    
    W_upright: 5.0                    # Torso orientation (scalar) - DeepMind "Upright" = 5.0
                                      # Penalizes deviation from vertical orientation
    
    w_balance: 5.0                    # Capture point tracking (scalar) - DeepMind "Balance" = 5.0
                                      # Linear Inverted Pendulum stability criterion

  # Norm types for each cost term
  # Available types: quadratic (0), l22 (1), l2 (2), cosh (3), smooth_abs_2_loss (7)
  # Parameters: p (regularization), q (power for L22 norm)
  norm_types:
    com_position:
      type: 0      # quadratic: r^T*r
      p: 1.0
      q: 1.0
    com_velocity:
      type: 0
      p: 1.0
      q: 1.0
    ee_position_foot_left:
      type: 0
      p: 1.0
      q: 1.0
    ee_position_foot_right:
      type: 0
      p: 1.0
      q: 1.0
    ee_velocity_foot_left:
      type: 0
      p: 1.0
      q: 1.0
    ee_velocity_foot_right:
      type: 0
      p: 1.0
      q: 1.0
    upright:
      type: 0
      p: 1.0
      q: 1.0
    balance:
      type: 0
      p: 1.0
      q: 1.0

  constraints:
    joint_limit_weight: 1500.0    # Keep same (safety)
    torque_limit_weight: 1500.0   # Keep same (safety)

  # iLQR solver settings - ONLY parameters actually implemented in our code
  # See docs/ilqr_parameter_comparison.md for full details
  ilqr_settings:
    # Core solver parameters
    initial_regularization: 1.0e-3         # Initial regularization value
    max_iterations: 10                     # Maximum iLQR iterations
    tolerance: 1.0e-4                      # Convergence tolerance
    
    # Regularization bounds and adaptation (aligned with MJPC where possible)
    reg_min: 1.0e-6                        # Minimum regularization (MJPC: 1e-6)
    reg_max: 1.0e6                         # Maximum regularization (MJPC: 1e6, was 100.0)
    reg_increase_factor: 10.0              # Factor to increase regularization
    reg_decrease_factor: 10.0              # Factor to decrease regularization
    
    # Trust region thresholds for regularization adaptation (aligned with MJPC)
    trust_region_good: 0.5                 # Good improvement threshold (MJPC: z > 0.5)
    trust_region_poor: 0.1                 # Poor improvement threshold (MJPC: z < 0.1)
    
    # Line search parameters
    line_search_alphas: [1.0, 0.8, 0.6, 0.4, 0.2, 0.1, 0.05, 0.01]  # Step size candidates
    line_search_tolerance: 1.0e-6          # Line search convergence tolerance
    
    # Quu regularization for numerical stability
    quu_regularization: 1.0e-4             # Added to Quu diagonal
    
    # Convergence criterion
    convergence_threshold: 1.0e-8          # Cost improvement threshold

paths:
  logs_dir: "logs"
  results_dir: "results"

logging:
  verbose: true
  save_trajectories: true
  results_path: "results"

visualization:
  enable_rerun: False
